# 债券阶梯策略
# 基于久期匹配和信用评级的债券基金组合构建

name: bond_ladder
display_name: 债券阶梯策略
description: 基于久期匹配和信用评级的纯债基金组合，控制回撤并获取稳定票息
category: fixed_income

instructions: |
  ## 债券阶梯策略规则

  ### 1. 基金筛选
  - 仅选择纯债基金（中长期纯债 + 短期纯债），排除：
    - 可转债基金
    - 二级债基（含股票仓位）
    - 混合型基金
  - 管理费率 > 0.5% 的基金排除
  - 规模 < 5亿 的基金排除（流动性风险）

  ### 2. 久期分层配置
  - 短久期（1-3年）：配置 40%，关注最大回撤 < 0.5%
  - 中久期（3-5年）：配置 40%，年化收益 > 3.5%
  - 长久期（5年+）：配置 20%，作为收益增强

  ### 3. 信用质量筛选
  - 优先选择高等级信用债持仓占比 > 80% 的基金
  - 避开城投债过度集中（单券种 > 20%）的基金

  ### 4. 风险控制
  - 近3年最大回撤 > 3% 的基金排除
  - 近1年 Sharpe < 1.0 的基金排除
  - 单只基金配置占比不超过 25%

  ### 评分权重
  - 近1年收益：30%
  - Sharpe 比率：25%
  - 最大回撤（反向）：20%
  - 管理费率（反向）：15%
  - 规模稳定性：10%

required_tools:
  - get_fund_nav_history
  - get_fund_manager_info
  - screen_funds

market_regimes:
  - rising_rates
  - falling_rates
  - flat

default_priority: 20
