# 价值精选策略
# 筛选被低估的主动权益基金，关注基金经理能力和持仓质量

name: value_screening
display_name: 价值精选策略
description: 筛选被市场低估的优质主动管理基金，侧重基金经理投研能力和持仓质量
category: active_equity

instructions: |
  ## 价值精选策略规则

  ### 1. 基金管理人评估
  - 基金经理从业年限 > 5年
  - 管理本基金年限 > 2年
  - 近3年同类排名前 1/3
  - 基金经理在同一公司任职稳定（无频繁跳槽）

  ### 2. 持仓质量分析
  - 前十大持仓 PE 均值低于同类
  - 持仓集中度 > 50%（重仓优质标的）
  - 行业分布不过度集中于单一行业（最大行业 < 40%）
  - 换手率 < 200%（非短线交易型）

  ### 3. 估值与收益
  - 近3年 Alpha（Jensen） > 3%（显著超额收益）
  - 近3年 Sharpe > 0.8
  - 当前回撤处于近2年回撤区间的中上位置（低位买点）
  - 规模 10-80 亿（策略容量适中）

  ### 4. 风险排除
  - 近3年最大回撤 > 35% 排除
  - 近期（3个月）有基金经理变更排除
  - 单季度业绩排名波动超过 50 个百分位排除

  ### 评分权重
  - 近3年 Alpha：30%
  - Sharpe 比率：25%
  - 基金经理年限：20%
  - 费率（反向）：15%
  - 规模适中：10%

required_tools:
  - get_fund_nav_history
  - get_fund_manager_info
  - get_fund_holdings

market_regimes:
  - bull
  - sideways
  - accumulation

default_priority: 30
