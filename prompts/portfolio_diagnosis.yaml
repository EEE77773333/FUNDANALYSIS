# 组合诊断优化提示词
# 使用场景：漏斗式提问法第三步——做体检
# 对现有基金持仓进行多维度诊断，发现行业过度集中、风格漂移、费率过高等问题

name: portfolio_diagnosis
title: 基金组合诊断优化
category: 组合优化
order: 7

system_prompt: |
  你是一位基金组合诊断专家，擅长通过穿透式分析发现组合层面的隐藏风险。
  你不仅关注单只基金的质量，更关注组合整体的风险收益特征、相关性结构和费用效率。
  你的诊断报告既指问题，也给解法，具有高度可操作性。

user_prompt_template: |
  请诊断我当前的基金组合，并给出优化建议。以下为持仓数据：

  ## 当前持仓明细
  {portfolio_data}

  ## 诊断任务

  ### 一、组合结构分析
  1. **资产配置偏离度**：当前实际股债配比与合理中枢的偏差
  2. **行业/赛道集中度**：
     - 穿透前十大重仓股，计算各行业（申万一级）的实际暴露度
     - 是否存在过度集中于某一行业（>30%）的问题？
     - 是否存在"隐性集中"：不同基金重仓了相同的股票？
  3. **风格暴露分析**：
     - 各持仓基金的风格标签（大盘/中盘/小盘 × 成长/均衡/价值）
     - 组合整体风格是否过度偏向某一象限？

  ### 二、质量审查
  1. **业绩归因**：
     - 各基金近1年/3年的 Alpha（择股能力）和 Beta（市场暴露）
     - 超额收益来源分解：行业配置贡献 vs 个股选择贡献
  2. **风格漂移检测**：
     - 是否有基金的持仓风格在近2年发生了显著漂移？
     - 如有，请标注为"⚠️ 风格漂移风险"
  3. **经理变更风险**：
     - 是否有基金经理近期变更？新任经理历史业绩如何？

  ### 三、成本效率
  1. **综合费率清单**：列出各基金的管理费+托管费+销售服务费
  2. **隐性成本估算**：高换手率基金产生的交易成本
  3. **可替代性分析**：是否有高费率基金可被低费率同类替代？

  ### 四、风险诊断
  1. **最大回撤来源分解**：组合历史最大回撤主要由哪些基金贡献？
  2. **相关性矩阵**：持仓基金之间的相关性是否过高（>0.85）？
  3. **流动性风险**：是否有小规模基金（<5000万）或限购基金？

  ## 输出要求
  - 用✅/⚠️/❌ 标注每个维度的健康状态
  - 列出**TOP 3 优先解决问题**（最紧迫的在前）
  - 给出具体的**调仓方案**（减仓/加仓/替换），附操作理由
  - 给出优化后的**目标组合配置表**
  - 预计优化组合在以下指标上能改善多少：
    - 预期波动率降低 X%
    - 夏普比率提升 X
    - 综合费率降低 X%

parameters:
  - name: portfolio_data
    type: text
    description: 当前基金持仓明细（含代码、名称、金额、占比、买入成本等）
    required: true
