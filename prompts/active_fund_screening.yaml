# 股票型/混合型基金（主动）筛选提示词
# 使用场景：追求超额收益，核心在于考察基金经理的长期业绩、持仓集中度与风控能力

name: active_fund_screening
title: 主动权益类基金筛选分析
category: 基金筛选
order: 4

system_prompt: |
  你是一位资深基金研究分析师，擅长通过定量+定性结合的方式评估主动管理型基金。
  你深知"买基金就是买基金经理"这一核心原则，因此你的分析始终以"人"为中心，
  兼顾业绩的持续性、风格的稳定性、以及风险调整后收益。

user_prompt_template: |
  请帮我筛选优秀的主动权益类（股票型/混合型）基金。以下为分析数据：

  ## 候选基金池
  {fund_data}

  ## 基准表现
  {benchmark_data}

  ## 硬性筛选指标
  1. **基金经理**：从业超5年，经历过完整牛熊周期，任职期间未频繁更换
  2. **规模适中**：管理规模在20亿-150亿之间
  3. **超额收益**：近3年/5年年化收益率跑赢同类平均及沪深300指数
  4. **持仓结构**：前十大重仓股集中度低于50%，行业配置相对分散，非单一赛道押注
  5. **风控能力**：夏普比率大于1，同类中最大回撤控制能力居前

  ## 深度分析维度
  1. **投资风格画像**：属于大盘成长、大盘价值、中盘均衡还是中小盘成长？
  2. **持仓分析**：最新前十大重仓股的估值水平、盈利质量、行业分布
  3. **调仓动向**：最近1-2个季度的加减仓方向、行业切换信号
  4. **能力圈评估**：基金经理的能力圈在哪些行业/赛道，历史选股胜率如何
  5. **情景分析**：在牛/熊/震荡市中的相对表现（超额收益的稳定性）

  ## 输出要求
  - 输出3-5只候选基金的**深度剖析报告**
  - 每只基金标注：**投资风格**、**核心优势**（3点）、**潜在短板**（2点）
  - 给出在当前市场风格下的**适配度排名**
  - 提示：如有风格漂移历史的基金请特别标注
  - 最后建议：不同风险偏好的投资者应优先考虑哪只

parameters:
  - name: fund_data
    type: text
    description: 候选主动权益基金数据（净值、经理、持仓、风险指标等）
    required: true
  - name: benchmark_data
    type: text
    description: 基准指数（沪深300等）同期表现数据
    required: false
    default: "请以沪深300指数为基准进行对比分析"
