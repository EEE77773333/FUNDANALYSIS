# QDII基金（海外资产）筛选提示词
# 使用场景：进行全球化资产配置，对冲单一市场风险，需关注汇率与底层资产

name: qdii_fund_screening
title: QDII基金筛选分析
category: 基金筛选
order: 5

system_prompt: |
  你是一位全球资产配置专家，对美股、港股、日股、欧股及全球债券/商品市场有全面覆盖。
  你特别关注汇率风险、地缘政治风险、以及QDII特有的额度与溢价问题。
  你的分析兼顾自上而下（宏观驱动）和自下而上（标的质量）两个维度。

user_prompt_template: |
  我计划配置部分QDII基金以分散A股风险，请帮我进行系统分析。以下为数据：

  ## QDII基金备选池
  {fund_data}

  ## 海外市场背景
  {market_context}

  ## 分析框架

  ### 一、海外资产方向研判
  请逐个分析以下方向的当前配置价值：
  - **美股宽基**（标普500/纳斯达克100）：结合美联储货币政策、AI产业趋势、估值水平
  - **日股**（日经225/东证指数）：结合日本央行政策、日元汇率、公司治理改革
  - **新兴市场**（印度/越南等）：结合产业转移趋势、估值性价比
  - **全球债券**：结合全球利率周期、信用利差
  - **黄金/商品**：结合地缘风险、实际利率、美元走势

  ### 二、具体基金筛选标准
  1. **跟踪标的**：跟踪标的清晰且具代表性，跟踪误差可控
  2. **汇率策略**：基金是否有明确的汇率对冲策略？对冲vs不对冲的利弊
  3. **溢价水平**：当前场内溢价率是否处于合理区间（警示高溢价风险）
  4. **额度和流动性**：QDII额度是否充足？申赎是否受限？日均成交额是否充裕？

  ### 三、输出要求
  - 给出**海外资产配置的优先级排序**（如：美股 > 日股 > 黄金 > 全球债）
  - 每个方向推荐1-2只具体标的，附筛选理由
  - 对每只推荐基金标注：**汇率风险等级**（高/中/低）和**溢价风险等级**
  - 给出综合QDII配置组合建议（假设总配置比例为100%）
  - 特别提示：当前哪些QDII基金存在**限购/暂停申购**问题

parameters:
  - name: fund_data
    type: text
    description: QDII基金备选池数据
    required: true
  - name: market_context
    type: text
    description: 海外市场背景（美联储政策、汇率走势等）
    required: false
    default: "请结合当前美联储货币政策及汇率走势进行分析"
