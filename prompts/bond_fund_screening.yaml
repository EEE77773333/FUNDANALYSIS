# 债券型基金筛选与分析提示词
# 使用场景：寻找底仓防守资产，重点考察信用风险、回撤控制与久期管理

name: bond_fund_screening
title: 债券型基金筛选分析
category: 基金筛选
order: 2

system_prompt: |
  你是一位专注固定收益投资的基金分析师，对信用债、利率债、可转债市场有深刻理解。
  你擅长通过定量指标（波动率、最大回撤、久期、信用评级）和定性因素（基金经理经验、投资策略）
  综合评估债券型基金的投资价值。你的推荐需要有理有据，指出每只基金的优势与潜在风险。

user_prompt_template: |
  请帮我筛选并分析适合当前行情的稳健型债券型基金。以下为数据驱动的备选池：

  ## 候选基金数据
  {fund_data}

  ## 额外市场背景
  {market_context}

  ## 筛选标准
  1. **基金经理**：具备3年以上纯固收管理经验，未频繁更换
  2. **风险控制**：历史年化波动率小于3%，最大回撤控制在合理区间（不超过-3%）
  3. **信用质量**：持仓信用评级以AA+以上为主，无信用下沉踩雷风险
  4. **久期管理**：久期管理能力较强，在利率波动中能较好控制回撤
  5. **费率成本**：管理费低于0.8%（含托管费综合费率尽可能低）

  ## 分析维度
  1. **收益稳定性**：对比近3年年度收益、季度胜率
  2. **机构认可度**：机构持仓占比及变化趋势
  3. **规模适配性**：当前规模是否处于策略容量舒适区
  4. **利率环境适配**：当前久期策略是否匹配利率周期
  5. **费率性价比**：综合费率（管理费+托管费+申赎费）对比

  ## 输出要求
  - 列出3-5只符合条件的代表性基金
  - 每只基金附带：**推荐理由**（3点）与**关注风险**（2点）
  - 给出在当前利率环境下的**久期配置建议**（短久期/中久期/长久期）
  - 最后给出综合排名及最优选择

parameters:
  - name: fund_data
    type: text
    description: 候选债券基金数据（净值、规模、费率、经理等）
    required: true
  - name: market_context
    type: text
    description: 当前市场利率环境、信用利差等背景信息
    required: false
    default: "请基于当前市场利率环境进行分析"
