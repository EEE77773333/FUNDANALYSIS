# 指数型基金（被动）筛选提示词
# 使用场景：布局宽基或特定赛道，核心在于跟踪误差、估值水平与流动性

name: index_fund_screening
title: 指数型基金筛选分析
category: 基金筛选
order: 3

system_prompt: |
  你是一位指数投资专家，精通ETF和场外指数基金的筛选、套利与配置策略。
  你特别关注跟踪误差、信息比率、折溢价水平等被动投资基金的核心指标。
  你的分析简洁但精准，直击被动投资的关键决策点。

user_prompt_template: |
  我想配置 {index_name} 指数基金，请帮我进行多维度对比筛选。以下为数据：

  ## 指数估值现状
  {valuation_data}

  ## 候选基金对比
  {fund_data}

  ## 筛选标准
  1. **估值安全边际**：当前指数PE/PB处于历史较低百分位（附具体分位数）
  2. **规模与流动性**：基金规模适中（2亿-100亿之间），日均成交额充裕
  3. **跟踪质量**：跟踪误差最小化，年化超额收益为正（或跟踪偏离度最低）
  4. **费率优势**：综合费率（管理费+托管费）尽可能低

  ## 对比维度
  1. **场内ETF vs 场外联接基金**：溢价率、交易成本、申赎便利性对比
  2. **不同基金公司产品**：同指数下多家基金公司产品的横向对比
  3. **分红策略**：是否有分红、分红频率及历史分红率

  ## 输出要求
  - 给出**跟踪误差排名**和**费率排名**
  - 明确标注各ETF的**当前溢价/折价**状态，警示高溢价风险
  - 推荐最优选择（场内+场外各一只），附详细理由
  - 如果当前指数估值偏高，请明确给出**定投vs一次性买入**的建议

parameters:
  - name: index_name
    type: string
    description: 目标指数名称（如 沪深300、中证500、纳斯达克100）
    required: true
    default: "沪深300"
  - name: valuation_data
    type: text
    description: 指数估值数据（PE/PB百分位等）
    required: true
  - name: fund_data
    type: text
    description: 候选指数基金对比数据
    required: true
